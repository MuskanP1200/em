# =============================================================================
# config.yaml — Unified Pipeline Configuration (Sandbox)
# All three pipelines (api_ingest, vehicle_verification, estimate_matching)
# read from this single file.
# Secrets (passwords, API keys) come from Azure Key Vault via settings.py.
# =============================================================================


# =============================================================================
# Pipeline run flags
# Set to false to skip a stage (e.g. to test VI/EM against a data dump without
# re-running ingestion).
# =============================================================================
run:
  ingestion:            true
  vehicle_verification: true
  estimate_matching:    true
  reset_staging_tables: false  # drop & recreate staging tables before running (set false in prod)
  reset_output_tables:  false  # drop & recreate EM output tables before running (set false in prod)


# ── Shared staging tables ─────────────────────────────────────────────────────
# api_ingest WRITES these; vehicle_verification and estimate_matching READ them.
# Change a name here and it propagates to all three pipelines.
tables:
  schema: container
  staging: #output from api calls is saved 
    est_raw:    m4_api_est_imgs    # one row per estimate
    est_line:  m4_api_est_line     # one row per line item
    est_subtot: m4_api_est_subtot   # one row per subtotal
  vi_output:
    folders_table:      m4_vi_estimate_results
    images_table:       m4_vi_image_results
  em_output:
    line_detail:   m4_em_est_line_dtl
    subtot_detail: m4_em_est_subtot_dtl
    est_summary:   m4_em_est_summary
    overall_summary: m4_est_overall_results

# =============================================================================
# api_ingest
# =============================================================================
api_ingest:
  status_code: WAITONAUTH   # estimate status to search for
  group:       DR            # CDR group code
  max_records: 200            # null = fetch all; integer = cap for smoke-testing
  max_workers: 5             # parallel threads for per-estimate API calls
  image_max_workers: 4

# =============================================================================
# vehicle_verification
# =============================================================================
vehicle_verification:

  # Column names in the shared staging table (tables.staging.est_raw)
  input_columns:
    id:            est_id
    prefix:        folder_prefix
    vin:           vin
    license_plate: licplte_nbr
    odometer:      odmtr_nbr

  processing:
    thumb_key:       tmp    # substring in filename that marks a thumbnail
    recursive:       false  # whether to descend into sub-folders of each prefix
    min_text_length: 4      # minimum OCR text length to consider an image "has text"

  parallelism:
    folder_workers:      3    # concurrent EST folders
    image_workers:       8   # concurrent images within a folder
    ocr_rate_limit:      20   # max simultaneous Azure Vision calls
    vlm_rate_limit:      100  # max simultaneous VLM calls
    max_inflight_images: 50   # hard cap on images being processed at once



# =============================================================================
# estimate_matching
# =============================================================================
estimate_matching:

  data_source_mode: prefiltered   # "prefiltered" | "api"

  tables_public:
    est_line: analysis.dd_est_line
    subtot:   analysis.dd_est_subtot

  numeric_cols:
    est_line:
      - lbr_hr_qty
      - est_tot_amt

      - dtl_part_nbr_qty
      - dtl_act_part_price_amt
      - dtl_tot_part_price_amt
      - cieca_line_adj_amt
      - cieca_line_net_amt

      - dtl_lbr_hr_qty
      - dtl_lbr_tot_amt
      - lbr_rate
      - paint_hrs          # refinish hours — used by match_labour_refinish

      - dtl_othr_chrg_price_amt
      - dtl_othr_chrg_qty

      - bdy_lbr_rate
      - mchncl_lbr_rate
      - frm_lbr_rate
      - almn_lbr_rate
      - pnt_mtrl_rate          # paint-and-material rate — used by match_paint_subtotals
    subtot:
      - gross_amt
      - adj_pct
      - adj_tot_amt
      - tot_amt
      - tot_hr
      - lbr_rate

  rounding:
    decimals: 0
    hrs_decimals: 1

  labor_type_rate_map:
