# =============================================================================
# config.yaml — Unified Pipeline Configuration (Sandbox)
# All three pipelines (api_ingest, vehicle_verification, estimate_matching)
# read from this single file.
# Secrets (passwords, API keys) come from Azure Key Vault via settings.py.
# =============================================================================


# =============================================================================
# Pipeline run flags
# Set to false to skip a stage (e.g. to test VI/EM against a data dump without
# re-running ingestion).
# =============================================================================
run:
  ingestion:            true
  vehicle_verification: true
  estimate_matching:    true
  reset_staging_tables: true  # drop & recreate staging tables before running (set false in prod)
  reset_output_tables:  true  # drop & recreate EM output tables before running (set false in prod)


# ── Shared staging tables ─────────────────────────────────────────────────────
# api_ingest WRITES these; vehicle_verification and estimate_matching READ them.
# Change a name here and it propagates to all three pipelines.
tables:
  schema: analysis
  staging: #output from api calls is saved 
    est_raw:    dd_est_imgs    # one row per estimate
    est_line:  dd_est_line     # one row per line item
    est_subtot: dd_est_subtot   # one row per subtotal
  vi_output:
    folders_table:      backup_dd_vi_estimate_results
    images_table:       backup_dd_vi_image_results
  em_output:
    line_detail:   backup_dd_em_est_line_dtl
    subtot_detail: backup_dd_em_est_subtot_dtl
    est_summary:   backup_dd_em_est_summary
    overall_summary: backup_dd_est_overall_results

# =============================================================================
# api_ingest
# =============================================================================
api_ingest:
  auth_url:    "http://appsecwse-iprod/appsec/enhanced/webservice/rsi"
  base_url:     "http://devaplyj:30040/vrservices/services"
  status_code: WAITONAUTH   # estimate status to search for
  group:       DR            # CDR group code
  max_records: 100            # null = fetch all; integer = cap for smoke-testing
  max_workers: 4             # parallel threads for per-estimate API calls


# =============================================================================
# vehicle_verification
# =============================================================================
vehicle_verification:

  # Column names in the shared staging table (tables.staging.est_raw)
  input_columns:
    id:            est_id
    prefix:        folder_prefix
    vin:           vin
    license_plate: licplte_nbr
    odometer:      odmtr_nbr

  processing:
    thumb_key:       tmp    # substring in filename that marks a thumbnail
    recursive:       false  # whether to descend into sub-folders of each prefix
    min_text_length: 4      # minimum OCR text length to consider an image "has text"

  parallelism:
    folder_workers:      3    # concurrent EST folders
    image_workers:       10   # concurrent images within a folder
    ocr_rate_limit:      20   # max simultaneous Azure Vision calls
    vlm_rate_limit:      100  # max simultaneous VLM calls
    max_inflight_images: 50   # hard cap on images being processed at once

  vlm:
    deployment:            gpt-4o
    api_version:           "2025-01-01-preview"
    prompt_cost_per_1k:    0.0025
    completion_cost_per_1k: 0.01
    currency:              USD
    
  logging:
    level:    INFO
    log_file: logs/vi_pipeline.log


# =============================================================================
# estimate_matching
# =============================================================================
estimate_matching:

  data_source_mode: prefiltered   # "prefiltered" | "live" | "api"

  sources:
    postgres:
      schema: ice

  llm:
    deployment:  gpt-4o
    api_version: "2024-12-01-preview"
    endpoint:    "https://musk-vo-1.openai.azure.com/"
    max_tokens:  4096

  filters:
    exclude_modules:
      - BULK_INVOICE
    country_codes:
      - USA
    est_stat_typ_ids:
      - 2
    since_minutes: null
    timestamp_col: create_timestamp
    limit: 50

  # ICE source tables (read-only; resolved against sources.postgres.schema)
  ice_tables:
    est:                 est
    repr:                repr_ncdnt
    veh:                 veh
    veh_ymms:            veh_ymms
    vndr:                vr_vndr
    cdr:                 cdr_grp_vndr
    est_repr:            est_repr
    elctrnc_est:         elctrnc_est_dtl
    cieca_dtl_hdr:       cieca_dtl_hdr
    cieca_part_dtl:      cieca_part_dtl_line
    cieca_lbr_dtl:       cieca_lbr_dtl_line
    cieca_othr_chrg_dtl: cieca_othr_chrg_dtl_line
    cieca_line_adj:      cieca_line_adj
    cieca_part_typ:      cieca_part_typ
    cieca_lbr_typ:       cieca_lbr_typ
    cieca_othr_chrg_typ: cieca_othr_chrg_typ

  tables_public:
    est_line: analysis.dd_est_line
    subtot:   analysis.dd_est_subtot

  columns:
    cieca_dtl_hdr:
      - cieca_dtl_hdr_id
      - line_dsc
      - line_nbr
    cieca_part_dtl:
      - cieca_part_dtl_line_id
      - cieca_dtl_hdr_id
      - cieca_line_adj_id
      - cieca_part_typ_id
      - dtl_part_nbr
      - dtl_part_nbr_qty
      - dtl_act_part_price_amt
      - dtl_tot_part_price_amt
    cieca_lbr_dtl:
      - cieca_lbr_dtl_line_id
      - cieca_dtl_hdr_id
      - cieca_lbr_typ_id
      - dtl_lbr_tot_amt
      - dtl_lbr_hr_qty
    cieca_othr_chrg_dtl:
      - cieca_othr_chrg_dtl_line_id
      - cieca_dtl_hdr_id
      - cieca_othr_chrg_typ_id
      - dtl_othr_chrg_price_amt
      - dtl_othr_chrg_qty
    cieca_line_adj:
      - cieca_line_adj_id
      - cieca_line_adj_amt

  output_columns:
    base:
      - est_id
      - cieca_dtl_hdr_id
      - line_item_count
      - line_nbr
      - lbr_hr_qty
      - est_tot_amt
      - grp_nbr
      - veh_make
      - dmg_dsc
      - line_dsc
    parts_input:
      - cieca_part_dtl_line_id
      - cieca_line_adj_id
      - cieca_part_typ_dsc
      - dtl_part_nbr
      - dtl_part_nbr_qty
      - dtl_act_part_price_amt
      - dtl_tot_part_price_amt
      - cieca_line_adj_amt
    labor_input:
      - cieca_lbr_dtl_line_id
      - cieca_lbr_typ_dsc
      - dtl_lbr_tot_amt
      - dtl_lbr_hr_qty
    other_charges:
      - cieca_othr_chrg_dtl_line_id
      - cieca_othr_chrg_typ_dsc
      - dtl_othr_chrg_price_amt
    rates:
      - bdy_lbr_rate
      - mchncl_lbr_rate
      - frm_lbr_rate
      - pnt_mtrl_rate
      - dmstc_part_disc_amt
      - frn_part_disc_amt
      - kyls_disc_amt
      - specl_instruct_txt
      - grp_note_txt
    parts_audit:
      - applicable_discount_pct
      - discount_source
      - evidence
      - discount_expected
      - expected_discount_amt
      - discount_match
      - discount_variance
      - discount_direction
      - finding
    labor_audit:
      - lbr_typ_hrs_match
      - unit_cost_based_lbr_dsc
      - calc_unit_cost
      - lbr_typ_unit_cost_match
      - overall_lbr_match
      - overcharged
      - undercharged
    other_chrg_audit:
      - other_charges_match
    parts_subtot_audit:
      - line_tot_part_amt
      - line_adj_amt
      - line_net_amt
      - tot_amt
      - adj_tot_amt
      - net_amt
      - parts_gross_match
      - adj_match
      - parts_net_match
      - overall_parts_subtot_match

  numeric_cols:
    est_line:
      - est_id
      - lbr_hr_qty
      - est_tot_amt
      - dtl_lbr_hr_qty
      - dtl_lbr_tot_amt
      # - lbr_rate
      - bdy_lbr_rate
      - frm_lbr_rate
      - dtl_part_nbr_qty
      - dtl_act_part_price_amt
      - dtl_tot_part_price_amt
      - cieca_line_adj_amt
      # - cieca_line_net_amt
      - cieca_dtl_hdr_id
    subtot:
      - est_id
      - gross_amt
      - adj_tot_amt
      - tot_amt
      - tot_hr

  groupby_cols:
    - est_id
    - cieca_lbr_typ_dsc

  aggregations:
    lbr_hr_qty:      {col: lbr_hr_qty,      func: mean}
    est_tot_amt:     {col: est_tot_amt,      func: mean}
    dtl_lbr_hr_qty:  {col: dtl_lbr_hr_qty,  func: sum}
    dtl_lbr_tot_amt: {col: dtl_lbr_tot_amt, func: sum}
    bdy_lbr_rate:    {col: bdy_lbr_rate,    func: mean}
    mchncl_lbr_rate: {col: mchncl_lbr_rate, func: mean}
    frm_lbr_rate:    {col: frm_lbr_rate,    func: mean}

  subtot_merge_cols:
    - est_id
    - cieca_lbr_typ_dsc

  subtot_rename_map:
    cieca_tot_typ_dsc: cieca_lbr_typ_dsc

  rounding:
    decimals: 1

  labor_type_rate_map:
    "Labor - Body":       bdy_lbr_rate
    "Labor - Mechanical": mchncl_lbr_rate
    "Labor - Frame":      frm_lbr_rate
    "Labor - Refinish":   bdy_lbr_rate
    "Labor - Structural": frm_lbr_rate

