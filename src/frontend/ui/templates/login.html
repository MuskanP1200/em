<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDR Assistant - Sign in</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            color: #0f172a;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at top, rgba(37, 99, 235, 0.10), transparent 35%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }

        .login-logo {
            display: block;
            width: 210px;
            max-width: 80%;
            height: auto;
            margin: 0 auto 1.5rem;
            object-fit: contain;
        }

        .login-title {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            line-height: 1.15;
            font-weight: 750;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin: 0 0 0.65rem;
        }

        .login-subtitle {
            font-size: 1rem;
            line-height: 1.5;
            color: #475569;
            margin: 0 auto 1.75rem;
            max-width: 320px;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            max-width: 300px;
            min-height: 3rem;
            padding: 0.8rem 1.25rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: 1px solid #2563eb;
            border-radius: 0.9rem;
            font-size: 1rem;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 3px;
        }

        .login-footer {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: 2rem 1.25rem;
                border-radius: 1.25rem;
            }

            .login-logo {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <main class="login-wrapper">
        <img class="login-logo" src="/assets/enterprise.jpg" alt="Enterprise logo" />

        <h1 class="login-title">CDR Assistant</h1>

        <p class="login-subtitle">
            Sign in with your Microsoft account to continue
        </p>

        <a class="login-button" href="/login">
            Sign in with Microsoft
        </a>

        <div class="login-footer">
            Secure sign-in via Azure Entra ID
        </div>
    </main>
</body>
</html>
