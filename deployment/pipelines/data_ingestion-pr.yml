trigger: none

pr:
  branches:
    include: [main]
  paths:
    include: [src/vo_pipeline/*]

jobs:
  - job: DataIngestionChecks
    pool: VO Pool
    workspace:
      clean: all
    steps:
      - script: |
          set -e
          cd src/vo_pipeline
          python3 -m venv $(Pipeline.Workspace)/.venv
          source $(Pipeline.Workspace)/.venv/bin/activate
          pip install -r requirements/requirements.txt
        displayName: 'Setup venv'
      - script: |
          set -e
          cd src/vo_pipeline
          source $(Pipeline.Workspace)/.venv/bin/activate
          make lint
        displayName: 'Data Ingestion lint'
        condition: succeededOrFailed()
      - script: |
          set -e
          cd src/vo_pipeline
          source $(Pipeline.Workspace)/.venv/bin/activate
          make format-check
        displayName: 'Data Ingestion check format'
        condition: succeededOrFailed()
      - script: |
          set -e
          cd src/vo_pipeline
          source $(Pipeline.Workspace)/.venv/bin/activate
          make python-sast
        displayName: 'Data Ingestion sast'
        condition: succeededOrFailed()
